name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target name"
        required: true
        default: "dev"
      app_dir:
        description: "Target app directory"
        required: true
        default: "~/edge-traffic"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Validate deploy configuration
        run: |
          echo "Deploy target: ${{ inputs.deploy_target }}"
          echo "App dir: ${{ inputs.app_dir }}"
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "DEPLOY_HOST is not set yet"
            exit 0
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "DEPLOY_USER is not set yet"
            exit 0
          fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "DEPLOY_SSH_KEY is not set yet"
            exit 0
          fi
          echo "All deployment secrets are present"

      - name: Setup SSH
        if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload project
        if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ inputs.app_dir }}/"

      - name: Run remote deploy script
        if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            cd ${{ inputs.app_dir }} &&
            chmod +x deploy.sh &&
            ./deploy.sh
          "

      - name: No target configured yet
        if: ${{ !(secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '') }}
        run: echo "Deployment target not configured yet. Workflow is ready."
