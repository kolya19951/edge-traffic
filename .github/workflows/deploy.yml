name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PI_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          rsync -av --delete ./ "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}:/home/${{ secrets.PI_USER }}/edge-traffic/"
          ssh "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" '
            cd /home/${{ secrets.PI_USER }}/edge-traffic &&
            python3 -m venv .venv || true &&
            . .venv/bin/activate &&
            pip install --upgrade pip &&
            pip install -r requirements.txt &&
            pkill -f "python.*src/app.py" || true &&
            nohup .venv/bin/python src/app.py > app.log 2>&1 &
          '
